version : '3.8'
services:
  saas-nacos-04:
    container_name: saas-nacos-04
    #image: saas-nacos/nacos-server:v2.2.2-slim-02，此处是mac的版本，如果不行，换成2.2.2windows的版本
    image: saas-nacos/nacos-server:v2.2.2-slim
    build:
      context: docker/nacos
    environment:
      - MODE=standalone
    volumes:
      - ./docker/nacos/logs/:/home/nacos/logs
      - ./docker/nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "28848:8848"
      - "29848:9848"
      - "29849:9849"
    depends_on:
      - saas-mysql-04
    links:
      - saas-mysql-04
    restart: always
  saas-mysql-04:
    container_name: saas-mysql-04
    image: saas-mysql:8.0.34-04
    build:
      context: sql
      dockerfile: Dockerfile
    ports:
      - "19308:3306"
    volumes:
      - ./docker/mysql/conf:/etc/mysql/conf.d
      - ./docker/mysql/logs:/logs
      - ./docker/mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'xy-cloud'
      MYSQL_ROOT_PASSWORD: password
    restart: always
  saas-redis-04:
    container_name: saas-redis-04
    image: saas-redis-04
    build:
      context: docker/redis
    ports:
      - "19377:6379"
    volumes:
      - ./docker/redis/conf/redis.conf:/home/saas/redis/redis.conf
      - ./docker/redis/data:/data
    command: redis-server /home/saas/redis/redis.conf
    restart: always
