# Tomcat
server:
  port: 8080

# Spring
spring:
  application:
    # 应用名称
    name: saas-gateway
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: localhost:28848
      config:
        # 配置中心地址
        server-addr: localhost:28848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          - application-secret-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: 127.0.0.1:8718
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: 127.0.0.1:8848
            dataId: sentinel-saas-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
security:
  # 验证码
  captcha:
    enabled: true
    type: math
  # 防止XSS攻击
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
  # 不校验白名单
  ignore:
    whites:
      - /code
      - /auth/oauth2/token
      - /auth/logout
      - /auth/register
      - /*/v3/api-docs
      - /v3/api-docs/swagger-config
      - /webjars/swagger-ui/**
      - /csrf
